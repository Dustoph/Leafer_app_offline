<div class="card hero frameGuide">
  <img id="preview" alt="Leaf preview" class="hidden">
  <div id="dropHint" class="dropHint">🌿<br>Take or upload a clear photo of one leaf</div>
  <div class="corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
</div>
<details class="card tips"><summary>📸 How to shoot for best accuracy</summary>
<ul><li>Fill the frame with <b>one leaf</b>, tip to stem.</li>
<li>Shoot <b>straight-on</b>, not at an angle.</li><li>No flash, no harsh shadow — <b>soft daylight</b> is best.</li>
<li>Plain background beats lawn/soil clutter.</li></ul></details>
<div class="btnrow">
  <label class="btn primary">📷 Camera<input id="camInput" type="file" accept="image/*" capture="environment" hidden></label>
  <label class="btn">🖼️ Gallery<input id="photoInput" type="file" accept="image/*" hidden></label>
</div>
<button id="analyzeBtn" class="btn analyze" disabled>🔍 Analyze leaf</button>
<div id="status" class="status"></div>
<div id="resultCard" class="card result hidden"></div>
