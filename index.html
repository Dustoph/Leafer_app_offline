<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<title>LeafCare — Plant Doctor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <img src="icon.svg" alt="" class="logo">
    <div><h1>LeafCare</h1><p class="tag">Plant Doctor · works offline</p></div>
    <span id="modelBadge" class="badge">model…</span>
  </header>

  <main id="app"></main>

  <nav class="tabbar">
    <button data-route="scan" class="tab active">🌱<span>Scan</span></button>
    <button data-route="history" class="tab">🗂️<span>History</span></button>
    <button data-route="profile" class="tab">👤<span>Profile</span></button>
  </nav>
</div>
<script src="vendor/tf.min.js"></script>
<script src="js/utils/dom.js"></script>
<script src="js/utils/format.js"></script>
<script src="js/utils/image.js"></script>
<script src="js/logic.js"></script>
<script src="js/db/storage.js"></script>
<script src="js/db/profiles.js"></script>
<script src="js/db/history.js"></script>
<script src="js/middleware/guards.js"></script>
<script src="js/model/preprocess.js"></script>
<script src="js/model/infer.js"></script>
<script src="js/model/loader.js"></script>
<script src="js/routes/router.js"></script>
<script src="js/routes/scan.js"></script>
<script src="js/routes/history.js"></script>
<script src="js/routes/profile.js"></script>
<script src="js/app.js"></script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
